<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex Login.html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Uploaded files must never be executed as PHP
    <Directory /var/www/html/assets/uploads>
        php_admin_flag engine off
        RemoveHandler .php .phtml .php5
        Options -ExecCGI
    </Directory>

    # Server-side only
    <DirectoryMatch "^/var/www/html/(PHPMailer|java|database|docker)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(seed|db|mailer|login_helpers|session)\.php$">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
